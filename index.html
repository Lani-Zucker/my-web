<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>绿色预览</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            background-color: #161618;
        }
        .card {
            background-color: #232326;
            padding: 50px 70px;
            border-radius: 24px;
            text-align: center;
            color: #e8e8e8;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }
        h2 { font-weight: 400; font-size: 32px; margin-bottom: 10px; }
        .sub { color: #57A99A; font-size: 18px; margin-bottom: 30px; }
        .btn-soft {
            background-color: #2A9D8F;
            color: #161618;
            border: none;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-soft:hover { filter: brightness(1.15); }
    </style>
</head>
<body>
    <div class="card">
        <h2>沉稳 · 自然</h2>
        <p class="sub">像翡翠在深色绒布上</p>
        <button class="btn-soft">进入工作区</button>
    </div>
</body>
</html>
