<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>我的实时调色盘</title>
    <style>
        /* ===== 页面整体 ===== */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            background-color: #161618;
            transition: background-color 0.1s;
        }

        /* ===== 主容器：左边卡片，右边控制区 ===== */
        .container {
            display: flex;
            gap: 60px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        /* ===== 卡片（就是你喜欢的深灰高级风） ===== */
        .card {
            background-color: #232326;
            padding: 50px 70px;
            border-radius: 24px;
            text-align: center;
            color: #e8e8e8;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: background-color 0.1s, transform 0.4s, box-shadow 0.4s;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
        }
        h2 {
            font-weight: 400;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .sub {
            font-size: 18px;
            margin-bottom: 30px;
            transition: color 0.1s;
            color: #67E8F9; /* 副标题默认青色 */
        }
        .btn-soft {
            border: none;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.1s, filter 0.2s;
            background-color: #22D3EE; /* 按钮默认青色 */
            color: #161618;
        }
        .btn-soft:hover {
            filter: brightness(1.2);
        }

        /* ===== 右边的控制面板 ===== */
        .controls {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            padding: 30px 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            min-width: 200px;
        }
        .controls h3 {
            color: #a0a0a5;
            font-weight: 400;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }
        .control-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            color: #c8c8cc;
            font-size: 14px;
        }
        .control-item label {
            flex: 1;
        }
        /* 这就是你想要的“滑动颜色块” */
        .control-item input[type="color"] {
            width: 45px;
            height: 45px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 0;
            cursor: pointer;
            background: none;
        }
        .control-item input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .control-item input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左侧：卡片预览 -->
    <div class="card" id="previewCard">
        <h2>欢迎来到我的空间</h2>
        <p class="sub" id="subText">拖动右边的色块试试</p>
        <button class="btn-soft" id="actionBtn">进入工作区</button>
    </div>

    <!-- 右侧：调色盘控制区 -->
    <div class="controls">
        <h3>🎨 实时调色</h3>
        
        <div class="control-item">
            <label>🔘 按钮颜色</label>
            <input type="color" id="primaryColor" value="#22D3EE">
        </div>

        <div class="control-item">
            <label>✏️ 文字点缀</label>
            <input type="color" id="secondaryColor" value="#67E8F9">
        </div>

        <div class="control-item">
            <label>📦 卡片底色</label>
            <input type="color" id="cardColor" value="#232326">
        </div>

        <div class="control-item">
            <label>🌑 页面背景</label>
            <input type="color" id="bgColor" value="#161618">
        </div>
    </div>
</div>

<script>
    // ===== 这下面就是“魔法”：你滑动色块，颜色立刻变 =====

    // 先找到卡片里需要变色的元素
    const card = document.getElementById('previewCard');
    const subText = document.getElementById('subText');
    const btn = document.getElementById('actionBtn');
    const body = document.body;

    // 找到4个颜色滑块
    const primaryInput = document.getElementById('primaryColor');
    const secondaryInput = document.getElementById('secondaryColor');
    const cardInput = document.getElementById('cardColor');
    const bgInput = document.getElementById('bgColor');

    // 监听“滑动”事件（你拖动颜色块时触发）
    primaryInput.addEventListener('input', function() {
        btn.style.backgroundColor = this.value;
    });

    secondaryInput.addEventListener('input', function() {
        subText.style.color = this.value;
    });

    cardInput.addEventListener('input', function() {
        card.style.backgroundColor = this.value;
    });

    bgInput.addEventListener('input', function() {
        body.style.backgroundColor = this.value;
    });
</script>

</body>
</html>
